# Запуск всего проекта: PostgreSQL + Django (gunicorn) + React (nginx).
# Подробности: README.md, раздел «Запуск через Docker Compose».
name: taskcontrol

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-taskcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskcontrol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Скопируйте .env.example в .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      TASKCONTROL_FRONTEND_URL: ${TASKCONTROL_FRONTEND_URL:-http://127.0.0.1:8080}
      TASKCONTROL_SEED_DEMO: ${TASKCONTROL_SEED_DEMO:-1}
      POSTGRES_DB: ${POSTGRES_DB:-taskcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-taskcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskcontrol}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      # Ollama runs on the host computer, not in a container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      TASKCONTROL_AI_MODEL: ${TASKCONTROL_AI_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${TASKCONTROL_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
